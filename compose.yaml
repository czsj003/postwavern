services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postwave
      POSTGRES_USER: postwave
      POSTGRES_PASSWORD: postwave
    ports:
      - "5432:5432"
    volumes:
      - postwave_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postwave -d postwave"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postwave_postgres_data: