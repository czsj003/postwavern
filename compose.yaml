services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postwave
      POSTGRES_USER: postwave
      POSTGRES_PASSWORD: postwave
    ports:
      - "5432:5432"
    volumes:
      - postwave_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postwave -d postwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/postwave
      DB_USERNAME: postwave
      DB_PASSWORD: postwave
      JWT_SECRET: ${JWT_SECRET:-cG9zdHdhdmUtZGV2LWp3dC1qd3Qtc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtcHJvZA==}
      UPLOAD_DIRECTORY: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8081}
    ports:
      - "8080:8080"
    volumes:
      - postwave_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postwave_postgres_data:
  postwave_uploads:
