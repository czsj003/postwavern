spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postwave}
spring.datasource.username=${DB_USERNAME:postwave}
spring.datasource.password=${DB_PASSWORD:postwave}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:cG9zdHdhdmUtZGV2LWp3dC1zZWNyZXQtbXVzdC1iZS0zMi1ieXRlcw==}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
